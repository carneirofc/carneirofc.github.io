# Single-package repo: this file only carries pnpm settings.

# pnpm blocks dependency lifecycle scripts by default; allow only the ones
# that do something this repo relies on.
allowBuilds:
  # Verifies the platform binary Velite's bundler (ADR 0004) runs on.
  esbuild: true
  # Its postinstall runs `lefthook install`, so `pnpm install` sets up the
  # git hooks (skipped when CI is set).
  lefthook: true
  # Both ship prebuilt platform binaries as optional dependencies; their
  # scripts are only a build-from-source fallback. sharp is never loaded
  # (static export, `images.unoptimized`).
  sharp: false
  unrs-resolver: false

# Security pins for transitive dependencies whose parents still ask for a
# vulnerable range (re-check with `pnpm audit`; drop an entry once its parent
# catches up).
overrides:
  # velite 0.4.0 asks for ^0.34.5 (libvips/libheif/librsvg CVEs, fixed in
  # 0.35.5). Velite only calls metadata() and resize().webp().toBuffer(),
  # which 0.35 kept as-is; its breaking changes (Node >= 20.9, no install
  # script) don't touch this repo. next already ships 0.35.5.
  "velite>sharp": ^0.35.5
  # @tailwindcss/typography 0.5.20 pins 6.0.10 (GHSA-rj75-hqrm-r3gf, quadratic
  # selector parsing). Same major; fixed in 6.1.5.
  "@tailwindcss/typography>postcss-selector-parser": ^6.1.6
