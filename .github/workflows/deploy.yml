name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queue a follow-up run instead of aborting one that may already be inside
  # actions/deploy-pages — a cancelled deployment leaves Pages half-updated.
  cancel-in-progress: false

env:
  # @carneirofc/ui is a link: dependency on the deedlit.dev.ui monorepo, checked
  # out as a sibling directory. Bump this sha together with pnpm-lock.yaml
  # when adopting UI changes.
  DEEDLIT_REF: 2e6f8ed56d8b36c16382fef05847c49dda2bb1ab

jobs:
  checks:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          path: site
      - uses: actions/checkout@v7
        with:
          repository: carneirofc/deedlit.dev.ui
          ref: ${{ env.DEEDLIT_REF }}
          path: deedlit.dev.ui
      # Installs the pnpm version pinned by `packageManager`.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # pnpm does not install dependencies of linked (link:) packages, so the
      # UI's runtime deps must exist in its own tree for tsc/next to resolve.
      # npm, not pnpm: at DEEDLIT_REF the sibling is still an npm workspace
      # with its own package-lock.json (ADR 0011).
      # React identity is unaffected: Next's App Router uses its vendored
      # React, and next.config.ts aliases + tsconfig paths pin the rest.
      - name: Install @carneirofc/ui runtime dependencies
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: deedlit.dev.ui/deedlit.dev.ui
      - run: pnpm run velite
      - name: Translation parity
        run: node scripts/check-translations.mjs
      - run: pnpm exec prettier --check .
      - run: pnpm exec eslint .
      - run: pnpm run typecheck
      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
      - name: Media metadata safety-net
        run: node scripts/check-media-metadata.mjs

  gitleaks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [checks, gitleaks]
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          path: site
      - uses: actions/checkout@v7
        with:
          repository: carneirofc/deedlit.dev.ui
          ref: ${{ env.DEEDLIT_REF }}
          path: deedlit.dev.ui
      # Installs the pnpm version pinned by `packageManager`.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The UI sources resolve their runtime deps (radix-ui, cva, …) from
      # their own tree, exactly as in local development (installed with npm;
      # see the checks job). React identity is unaffected: Next's App Router
      # uses its vendored React, and next.config.ts aliases + tsconfig paths
      # pin the rest.
      - name: Install @carneirofc/ui runtime dependencies
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: deedlit.dev.ui/deedlit.dev.ui
      - run: pnpm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out
      - id: deployment
        uses: actions/deploy-pages@v5
