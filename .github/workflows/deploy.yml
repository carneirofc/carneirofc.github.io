name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # @carneirofc/ui is a file: dependency on the deedlit.dev monorepo, checked
  # out as a sibling directory. Bump this sha together with package-lock.json
  # when adopting UI changes.
  DEEDLIT_REF: 31518054899c4154d83a25cfe411c117bf0eb636

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: carneirofc/deedlit.dev
          ref: ${{ env.DEEDLIT_REF }}
          path: deedlit.dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run velite
      - run: npx prettier --check .
      - run: npx eslint .
      - run: npm run typecheck
      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
      - name: Media metadata safety-net
        run: node scripts/check-media-metadata.mjs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [checks, gitleaks]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: carneirofc/deedlit.dev
          ref: ${{ env.DEEDLIT_REF }}
          path: deedlit.dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # The UI sources resolve their runtime deps (radix-ui, cva, …) from
      # their own tree, exactly as in local development. React stays a single
      # copy via the aliases in next.config.ts. --legacy-peer-deps skips
      # installing the react peer so no second copy exists at all.
      - name: Install @carneirofc/ui runtime dependencies
        run: npm install --omit=dev --legacy-peer-deps --no-audit --no-fund
        working-directory: deedlit.dev/deedlit.dev.ui
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out
      - id: deployment
        uses: actions/deploy-pages@v4
